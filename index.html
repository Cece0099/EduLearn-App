<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f8cff">
  <title>EduLearn</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f8ff;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: min(92%, 520px);
      background: white;
      border-radius: 24px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,.08);
    }
    .logo {
      font-size: 64px;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0 0 10px;
      color: #2563eb;
      font-size: 36px;
    }
    p {
      line-height: 1.6;
      color: #64748b;
    }
    .download {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 25px;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 17px;
    }
    .download:hover {
      background: #1d4ed8;
    }
    .note {
      margin-top: 20px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">📚</div>
    <h1>EduLearn</h1>
    <p>
      Platform pembelajaran digital untuk guru dan siswa.
      Belajar, membuat materi, mengerjakan kuis, dan melihat nilai
      dalam satu aplikasi.
    </p>

    <a class="download" href="EduLearn.apk">
      📱 Download EduLearn APK
    </a>

    <div class="note">
      Android • EduLearn
    </div>
  </div>
</body>
</html>
